services:
  postgres:
    image: postgres:16
    container_name: dss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dss
      POSTGRES_PASSWORD: dss
      POSTGRES_DB: enrollment_dss
    ports:
      - "5432:5432"
    volumes:
      - dss_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dss -d enrollment_dss"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dss_pgdata:
