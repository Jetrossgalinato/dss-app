name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-installer
            build_command: npm run dist:win
            artifact_paths: |
              frontend/release/*.exe
          - name: Linux x64
            os: ubuntu-latest
            artifact: linux-installers
            build_command: npm run dist:linux
            artifact_paths: |
              frontend/release/*.AppImage
              frontend/release/*.deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev --group desktop --frozen

      - name: Test backend
        working-directory: backend
        run: uv run --frozen pytest -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test and type-check frontend
        working-directory: frontend
        run: |
          npm test
          npm run typecheck

      - name: Build desktop installers
        working-directory: frontend
        run: ${{ matrix.build_command }}

      - name: Smoke-test bundled backend
        run: python scripts/smoke_sidecar.py

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
